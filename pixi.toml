[workspace]
name = "01-ecommerce-product-analytics"
version = "0.1.0"
description = "Tactile Neumorphic E-Commerce Product Analytics Dashboard & A/B Testing Simulator"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
streamlit = ">=1.40.0"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
seaborn = ">=0.12.0"
matplotlib = ">=3.7.0"
scipy = ">=1.10.0"
scikit-learn = ">=1.3.0"
sqlalchemy = ">=2.0.0"
ipykernel = ">=6.23.0"

[tasks]
download-data = "python data/download_data.py"
data-prep = "python src/data_prep.py"
train-model = "python src/train_model.py"
app = "streamlit run streamlit_app.py"
